<div class="chat-container">
  <div class="chat-window">
    <div *ngFor="let m of messages" class="message" [ngClass]="m.role">
      <div class="bubble">
        <span *ngIf="m.role === 'user'" class="label">You</span>
        <span *ngIf="m.role === 'assistant'" class="label">Assistant</span>

        <!-- User messages: plain text -->
        <p *ngIf="m.role === 'user'">{{ m.text }}</p>

        <!-- Assistant messages: rendered HTML -->
        <div
          *ngIf="m.role === 'assistant' && m.html"
          class="markdown-content"
          [innerHTML]="m.html"
        ></div>

        <div class="shots" *ngIf="m.shots?.length">
          <img *ngFor="let s of m.shots" [src]="s" alt="screenshot" />
        </div>
      </div>
    </div>
    <div *ngIf="loading" class="loading">Thinking...</div>
  </div>

  <div class="input-bar">
    <input
      [(ngModel)]="input"
      name="prompt"
      (keydown.enter)="send()"
      placeholder="Ask Me.."
    />
    <button (click)="send()" [disabled]="loading || !input.trim()">Send</button>
  </div>
</div>
